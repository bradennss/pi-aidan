name: monorepo-reports
services:
  db:
    profiles: [dev]
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: monorepo_local
      POSTGRES_PASSWORD: disposable-local-only
      POSTGRES_DB: monorepo_dev
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["dev-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monorepo_local -d monorepo_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway-db:
    profiles: [gateway]
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: monorepo_local
      POSTGRES_PASSWORD: disposable-local-only
      POSTGRES_DB: monorepo_gateway
    volumes: ["gateway-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monorepo_local -d monorepo_gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    profiles: [gateway]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment: &gateway-env
      DATABASE_URL: postgresql://monorepo_local:disposable-local-only@gateway-db:5432/monorepo_gateway
    command:
      [
        "sh",
        "-ec",
        "goose -dir /migrations postgres $$DATABASE_URL up; river migrate-up --database-url $$DATABASE_URL",
      ]
    depends_on:
      gateway-db: { condition: service_healthy }
  api:
    profiles: [gateway]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      <<: *gateway-env
      API_ADDR: ":8080"
    command: ["api"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    profiles: [gateway]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    environment: *gateway-env
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  gateway:
    profiles: [gateway]
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      # Disposable local fixture only: demo / disposable-local-only.
      BASIC_AUTH_HASH: "$$2a$$14$$KZqRw/4DXj8i/DzhziNuy.Qo4PxgK8ZhJE0hN83ikNG49hXC6jk6S"
    ports: ["127.0.0.1:4184:80"]
    depends_on: [api, worker]
volumes:
  gateway-data:
  dev-data:
