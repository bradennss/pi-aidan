name: monorepo-reports
services:
  db:
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: monorepo_local
      POSTGRES_PASSWORD: disposable-local-only
      POSTGRES_DB: monorepo_dev
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["dev-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monorepo_local -d monorepo_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev-data:
