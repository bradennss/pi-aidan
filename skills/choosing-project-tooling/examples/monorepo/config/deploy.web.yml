service: monorepo-web
image: <%= ENV.fetch("IMAGE_REPOSITORY") %>-web
servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    options:
      memory: 128m
      cpus: 1
      pids-limit: 256
registry:
  server: ghcr.io
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  secret:
    - BASIC_AUTH_USER
    - BASIC_AUTH_HASH
builder:
  arch: amd64
  dockerfile: Dockerfile.web
ssh:
  user: deploy
  config: <%= ENV.fetch("SSH_CONFIG_FILE") %>
  forward_agent: false
retain_containers: 3
deploy_timeout: 90
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_DOMAIN") %>
  app_port: 80
  healthcheck:
    path: /up
