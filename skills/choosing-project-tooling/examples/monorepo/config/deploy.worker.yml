service: monorepo-worker
image: <%= ENV.fetch("IMAGE_REPOSITORY") %>-worker
servers:
  workers:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    proxy: false
    cmd: worker
    options:
      memory: 512m
      cpus: 2
      pids-limit: 256
primary_role: workers
registry:
  server: ghcr.io
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  secret:
    - DATABASE_URL
builder:
  arch: amd64
  dockerfile: Dockerfile.backend
  target: worker
ssh:
  user: deploy
  config: <%= ENV.fetch("SSH_CONFIG_FILE") %>
  forward_agent: false
retain_containers: 3
deploy_timeout: 90
