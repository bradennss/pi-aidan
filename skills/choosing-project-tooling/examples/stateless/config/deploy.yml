service: stateless
image: <%= ENV.fetch("IMAGE_REPOSITORY") %>
servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    options:
      memory: 256m
      cpus: 1
      pids-limit: 128
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_DOMAIN") %>
  app_port: 80
  healthcheck:
    path: /up
registry:
  server: ghcr.io
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
ssh:
  user: deploy
  config: <%= ENV.fetch("SSH_CONFIG_FILE") %>
  forward_agent: false
retain_containers: 3
