<%
  game_version = ENV.fetch("GAME_VERSION")
  server_image = ENV.fetch("SERVER_IMAGE")
  raise "Select an exact release game version" unless game_version.match?(/\A[0-9]+(?:\.[0-9]+){1,2}\z/)
  raise "Select an exact upstream Java image tag and digest" unless server_image.match?(/\Aitzg\/minecraft-server:[0-9]{4}\.[0-9]{1,2}\.[0-9]+-java[0-9]+@sha256:[0-9a-f]{64}\z/)
  raise "Set licensed Java profile allowlist" unless ENV.fetch("WHITELIST").match?(/\A[A-Za-z0-9_]{3,16}(?:,[A-Za-z0-9_]{3,16})*\z/)
%>
service: minecraft
# Native accessory-only configuration still requires this global image field.
# No app role exists or is deployed. Every command selects --hosts explicitly.
image: itzg/minecraft-server
registry:
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
ssh:
  user: deploy
  config: <%= ENV.fetch("SSH_CONFIG_FILE") %>
  forward_agent: false
accessories:
  game:
    service: minecraft-game
    image: <%= server_image %>
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "0.0.0.0:25565:25565/tcp"
    # No proxy key: accessories interpret its presence as proxy enablement.
    env:
      clear:
        TYPE: VANILLA
        VERSION: <%= game_version.inspect %>
        INIT_MEMORY: 1G
        MAX_MEMORY: 4G
        ONLINE_MODE: "TRUE"
        ENABLE_WHITELIST: "TRUE"
        ENFORCE_WHITELIST: "TRUE"
        EXISTING_WHITELIST_FILE: SYNCHRONIZE
        ENABLE_RCON: "TRUE"
        RCON_PORT: "25575"
        RCON_PASSWORD_FILE: /run/secrets/rcon-password
        BROADCAST_RCON_TO_OPS: "FALSE"
        ENABLE_QUERY: "FALSE"
        MAX_PLAYERS: "10"
      secret:
        - WHITELIST
    # Fixed host storage, never a relative Kamal-managed data directory.
    volumes:
      - /srv/minecraft/worlds/primary:/data
      - /etc/minecraft/rcon-password:/run/secrets/rcon-password:ro
    options:
      env-file: /etc/minecraft/eula.env
      restart: "no"
      memory: 6g
      cpus: 3
      pids-limit: 512
      stop-timeout: 120
      network-alias: minecraft-game
