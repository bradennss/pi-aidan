- name: Configure minecraft host
  hosts: all
  become: true
  vars:
    admin_cidrs: "{{ lookup('env', 'ADMIN_CIDRS').split(',') }}"
    admin_public_key: "{{ lookup('env', 'ADMIN_PUBLIC_KEY') }}"
    disable_bootstrap: false
    reboot_authorized: false
  pre_tasks:
    - name: Require Debian 13 and explicit access inputs
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] == '13'
          - admin_cidrs | length > 0
          - admin_cidrs[0] | length > 0
          - "'0.0.0.0/0' not in admin_cidrs"
          - "'::/0' not in admin_cidrs"
          - admin_public_key.startswith('ssh-ed25519 ')
          - lookup('env', 'ALERT_WEBHOOK') is match('^https://[A-Za-z0-9./_?=&%:+~-]+$')
          - lookup('env', 'PUBLIC_INTERFACE') is match('^[a-zA-Z0-9_.-]+$')
    - name: Require explicit nonzero administration network prefixes
      ansible.builtin.assert:
        that:
          - item is match('^[0-9a-fA-F:.]+/[1-9][0-9]*$')
      loop: "{{ admin_cidrs }}"
  tasks:
    - name: Install host packages from Debian repositories
      ansible.builtin.apt:
        name:
          [
            docker.io,
            docker-cli,
            docker-compose,
            jq,
            util-linux,
            sudo,
            nftables,
            unattended-upgrades,
            needrestart,
            curl,
          ]
        state: present
        update_cache: true
    - name: Install native encrypted backup client
      ansible.builtin.apt:
        name: restic
        state: present
    - name: Create deployment administrator
      ansible.builtin.user:
        name: deploy
        groups: [sudo, docker]
        append: true
        shell: /bin/bash
    - name: Protect operational credentials
      ansible.builtin.file:
        path: /etc/minecraft
        state: directory
        owner: root
        group: deploy
        mode: "0750"
    - name: Validate backup and administration credentials
      ansible.builtin.assert:
        that:
          - lookup('env', 'RESTIC_REPOSITORY') is match('^s3:https://[A-Za-z0-9./_-]+/minecraft$')
          - lookup('env', 'RESTIC_PASSWORD') is match('^[A-Za-z0-9_-]{43,}$')
          - lookup('env', 'RCON_PASSWORD') is match('^[A-Za-z0-9_-]{43,}$')
          - lookup('env', 'AWS_ACCESS_KEY_ID') is match('^[A-Za-z0-9]+$')
          - lookup('env', 'AWS_SECRET_ACCESS_KEY') is match('^[A-Za-z0-9/+=_-]+$')
      no_log: true
    - name: Install file-backed passwords outside ordinary environment files
      ansible.builtin.copy:
        dest: "/etc/minecraft/{{ item.file }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ lookup('env', item.key) }}\n"
      loop:
        - { file: rcon-password, key: RCON_PASSWORD }
        - { file: restic-password, key: RESTIC_PASSWORD }
      no_log: true
    - name: Install root-only off-host backup credentials
      ansible.builtin.copy:
        dest: /etc/minecraft/backup.env
        owner: root
        group: root
        mode: "0600"
        content: |
          RESTIC_REPOSITORY={{ lookup('env', 'RESTIC_REPOSITORY') }}
          RESTIC_PASSWORD_FILE=/etc/minecraft/restic-password
          AWS_ACCESS_KEY_ID={{ lookup('env', 'AWS_ACCESS_KEY_ID') }}
          AWS_SECRET_ACCESS_KEY={{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}
          AWS_DEFAULT_REGION=auto
      no_log: true
    - name: Leave acceptance false until the operator personally changes it
      ansible.builtin.copy:
        dest: /etc/minecraft/eula.env
        content: "EULA=FALSE\n"
        force: false
        owner: root
        group: deploy
        mode: "0640"
    - name: Create private storage parent
      ansible.builtin.file:
        path: /srv/minecraft
        state: directory
        owner: root
        group: deploy
        mode: "0750"
    - name: Create persistent world and isolated restore roots
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/srv/minecraft/worlds, /srv/minecraft/worlds/primary, /srv/minecraft/restores]
    - name: Install native backup Compose configuration
      ansible.builtin.copy:
        src: ../config/backup.compose.yml
        dest: /etc/minecraft/backup.compose.yml
        mode: "0644"
    - name: Create cache and mask-compatible local unit location
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/var/cache/minecraft-restic, /usr/local/lib/systemd/system]
    - name: Install native Minecraft backup units below persistent masks
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/usr/local/lib/systemd/system/{{ item }}"
        mode: "0644"
      loop: [minecraft-backup.service, minecraft-backup.timer]
    - name: Install administrator key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ admin_public_key }}"
    - name: Allow noninteractive administration
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
    - name: Bound Docker logs and disable IPv6 bridge networking
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"},"ipv6":false}'
        mode: "0644"
      notify: Restart Docker
    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
    - name: Install declarative host and Docker ingress firewall
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        mode: "0644"
        validate: /usr/sbin/nft -c -f %s
      notify: Reload firewall
    - name: Enable native nftables persistence
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started
    - name: Enable automatic security upgrades without automatic reboots
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52minecraft
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Origins-Pattern { "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"; };
          Unattended-Upgrade::Automatic-Reboot "false";
    - name: Create journal configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
    - name: Bound system journal
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/minecraft.conf
        mode: "0644"
        content: "[Journal]\nSystemMaxUse=200M\nMaxRetentionSec=7day\n"
      notify: Restart journal
    - name: Install failure notification credentials
      ansible.builtin.copy:
        dest: /etc/minecraft-alert.env
        mode: "0600"
        content: "ALERT_WEBHOOK={{ lookup('env', 'ALERT_WEBHOOK') }}\n"
      no_log: true
    - name: Install failure notification service
      ansible.builtin.template:
        src: failure-alert.service.j2
        dest: /etc/systemd/system/minecraft-alert.service
        mode: "0644"
    - name: Install host health check
      ansible.builtin.copy:
        dest: /etc/systemd/system/minecraft-health.service
        mode: "0644"
        content: |
          [Unit]
          OnFailure=minecraft-alert.service
          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'test "$$(df --output=pcent / | tail -1 | tr -dc 0-9)" -lt 85 && report=$$(needrestart -b -r l) && ! echo "$$report" | grep -Eq "NEEDRESTART-KSTA: [23]" && test -z "$$(systemctl --failed --no-legend)"'
    - name: Schedule host health check
      ansible.builtin.copy:
        dest: /etc/systemd/system/minecraft-health.timer
        mode: "0644"
        content: |
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=15min
          [Install]
          WantedBy=timers.target
    - name: Enable health timer
      ansible.builtin.systemd_service:
        name: minecraft-health.timer
        daemon_reload: true
        enabled: true
        state: started
    - name: Enable daily backup only after authorized game and repository verification
      ansible.builtin.systemd_service:
        name: minecraft-backup.timer
        daemon_reload: true
        enabled: true
        state: started
      when: backup_schedule_enabled | default(false) | bool
    - name: Verify independent administrator connection before disabling bootstrap
      ansible.builtin.command:
        argv:
          [
            ssh,
            -o,
            BatchMode=yes,
            -o,
            StrictHostKeyChecking=yes,
            -o,
            'UserKnownHostsFile={{ lookup("env", "SSH_KNOWN_HOSTS") }}',
            "deploy@{{ ansible_host }}",
            sudo,
            -n,
            "true",
          ]
      delegate_to: localhost
      become: false
      changed_when: false
      when: disable_bootstrap | bool
    - name: Disable bootstrap login only after access verification
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-minecraft.conf
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AllowUsers deploy
        validate: /usr/sbin/sshd -t -f %s
      when: disable_bootstrap | bool
      notify: Reload SSH
    - name: Load managed SSH policy before image-provided defaults
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        line: Include /etc/ssh/sshd_config.d/00-minecraft.conf
        validate: /usr/sbin/sshd -t -f %s
      when: disable_bootstrap | bool
      notify: Reload SSH
    - name: Perform explicitly authorized maintenance reboot
      ansible.builtin.reboot:
      when: reboot_authorized | bool
  handlers:
    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
    - name: Reload firewall
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded
    - name: Restart journal
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
