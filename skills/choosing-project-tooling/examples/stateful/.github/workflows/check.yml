name: Check
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [infra/production.tfstate]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - run: just install
      - run: just check
      - run: just build
      - run: just infra-validate
      - run: just install-host && just host-check
      - run: actionlint .github/workflows/*.yml
      - run: just test-operations
      - run: docker build -t stateful:recovery .
      - run: just test-recovery
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: node pnpm just
      - run: just install
      - run: just install-browser
      - run: just test-integration
      - run: just test-browser
