name: Deploy
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Retry an existing immutable image for the current application revision
        required: true
permissions:
  contents: read
concurrency:
  group: production-app
  cancel-in-progress: false
jobs:
  image:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ steps.image.outputs.revision }}
      repository: ${{ steps.image.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require production runner before publishing
        env:
          RUNNER: ${{ vars.PRODUCTION_RUNNER }}
        run: test -n "$RUNNER" || { echo 'Configure PRODUCTION_RUNNER with trusted static egress before production work' >&2; exit 1; }
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: jq
      - name: Publish once or reuse existing image
        id: image
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || inputs.revision }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$'
          test "$REVISION" = "$(git log -1 --format=%H -- . ':(exclude)infra/production.tfstate')"
          image="${GITHUB_REPOSITORY,,}"
          token=$(curl --fail --silent --show-error -u "$GITHUB_ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$image:pull,push" | jq -er .token)
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$image/manifests/$REVISION")
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          case "$status" in
            200) echo 'Reusing existing immutable image' ;;
            404)
              test "$EVENT" = workflow_run
              git checkout --detach "$REVISION"
              printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker build --platform linux/amd64 -t "ghcr.io/$image:$REVISION" .
              docker push "ghcr.io/$image:$REVISION"
              ;;
            *) echo "Registry lookup failed ($status); refusing to build or overwrite" >&2; exit 1 ;;
          esac
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "repository=$image" >> "$GITHUB_OUTPUT"
  deploy:
    needs: image
    runs-on: ${{ vars.PRODUCTION_RUNNER }}
    environment: production-app
    env:
      SOPS_AGE_KEY: ${{ secrets.DEPLOY_AGE_KEY }}
      REVISION: ${{ needs.image.outputs.revision }}
      IMAGE_REPOSITORY: ${{ needs.image.outputs.repository }}
      DEPLOY_AUTHORIZED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - name: Reject stale target immediately before deployment
        run: |
          test "$REVISION" = "$(git log -1 --format=%H -- . ':(exclude)infra/production.tfstate')"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Deploy prebuilt image using ephemeral SSH identity
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -f "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/ssh_config"' EXIT
          export SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts"
          export SSH_CONFIG_FILE="$RUNNER_TEMP/ssh_config"
          # shellcheck disable=SC2016 # Decrypted child environment expands these variables.
          sops exec-env secrets/deploy.enc.yaml 'bash -eu -o pipefail -c '\''
            printf "%s\n" "$SSH_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_FILE"
            chmod 600 "$SSH_KNOWN_HOSTS_FILE"
            printf "Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s\n" "$SSH_KNOWN_HOSTS_FILE" > "$SSH_CONFIG_FILE"
            chmod 600 "$SSH_CONFIG_FILE"
            ssh-add - <<< "$DEPLOY_SSH_KEY"
            export SSH_KNOWN_HOSTS_FILE
            just deploy "$REVISION"
          '\'''
