name: stateful-task-tracker
services:
  db:
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: stateful_local
      POSTGRES_PASSWORD: disposable-local-only
      POSTGRES_DB: stateful_dev
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["dev-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateful_local -d stateful_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  test-db:
    profiles: [test]
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_USER: stateful_local
      POSTGRES_PASSWORD: disposable-local-only
      POSTGRES_DB: stateful_test
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["test-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateful_local -d stateful_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    profiles: [test]
    build: .
    environment:
      DATABASE_URL: postgresql://stateful_local:disposable-local-only@test-db:5432/stateful_test
    depends_on:
      test-db:
        condition: service_healthy
    # No published app port: all boundary tests pass through the gateway.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 6s
      retries: 30
  gateway:
    profiles: [test]
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    environment:
      BASIC_AUTH_USER: stateful-test
      # Hash of disposable-gateway-only. Local fixtures, never production access.
      BASIC_AUTH_HASH: "$$2a$$14$$4Nb.dvcT/BDWlz0/Uqziy.morUYofYDB9E5hh6E6tC17p4aXN1Ma."
    ports: ["127.0.0.1:8088:8080"]
    volumes: ["./config/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  dev-data:
  test-data:
