name: Release
on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: Original release run ID to reuse after a publication failure (empty builds once)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_run: ${{ steps.identity.outputs.artifact_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REUSE_RUN: ${{ inputs.reuse_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.0
          cache: false
      - name: Require the current default-branch revision and original attempt
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'Do not rerun jobs. Dispatch with reuse_run instead.' >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)" = "$GITHUB_SHA"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json"));
            assert.equal(p.private, false, "Prepare the owned package identity explicitly first");
            assert.notEqual(p.name, "unpublished-aidan-duration-example");
          '
          if test -n "$REUSE_RUN"; then
            [[ "$REUSE_RUN" =~ ^[1-9][0-9]*$ ]]
            test "$REUSE_RUN" != "$GITHUB_RUN_ID"
            gh api "repos/$GH_REPO/actions/runs/$REUSE_RUN" > "$RUNNER_TEMP/original-run.json"
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import fs from "node:fs";
              const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/original-run.json"));
              assert.equal(r.repository.full_name, process.env.GH_REPO);
              assert.equal(r.path, ".github/workflows/release.yml");
              assert.equal(r.event, "workflow_dispatch");
              assert.equal(r.head_sha, process.env.GITHUB_SHA);
              assert.equal(r.head_branch, process.env.DEFAULT_BRANCH);
              assert.equal(r.run_attempt, 1);
              assert.equal(r.status, "completed");
              assert.ok(["success", "failure"].includes(r.conclusion));
            '
            echo "artifact_run=$REUSE_RUN" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_run=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
      - if: inputs.reuse_run == ''
        run: just check test-consumer
      - if: inputs.reuse_run == ''
        name: Record the verified bytes and source
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { createHash } from "node:crypto";
            const integrity = "sha512-" + createHash("sha512").update(fs.readFileSync(".artifacts/package.tgz")).digest("base64");
            fs.writeFileSync(".artifacts/release.json", JSON.stringify({ revision: process.env.GITHUB_SHA, integrity }) + "\n");
          '
      - if: inputs.reuse_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ github.sha }}
          path: .artifacts
          run-id: ${{ steps.identity.outputs.artifact_run }}
          github-token: ${{ github.token }}
      - run: node scripts/verify-release-artifact.mjs "$GITHUB_SHA"
      - if: inputs.reuse_run != ''
        run: just test-packed
      - if: inputs.reuse_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.sha }}
          path: |
            .artifacts/package.tgz
            .artifacts/release.json
          if-no-files-found: error
          # The two public files are explicitly allowlisted under a hidden directory.
          include-hidden-files: true
          retention-days: 14
          overwrite: false
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.0
          cache: false
          install_args: node gh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ github.sha }}
          path: .artifacts
          run-id: ${{ needs.prepare.outputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Verify bytes, source, approval setup, and registry absence before publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RELEASE_ENABLED" = true
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          node scripts/verify-release-artifact.mjs "$GITHUB_SHA"
          name="$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).name')"
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          # A failed lookup (including E404) stops here; bootstrap must already exist.
          npm view "$name" versions --json --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=30000 > "$RUNNER_TEMP/versions.json"
          node scripts/assert-version-absent.mjs "$version" < "$RUNNER_TEMP/versions.json"
          test "$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)" = "$GITHUB_SHA"
          # No dependency install, lifecycle scripts, or fresh pack in the OIDC job.
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish ./.artifacts/package.tgz --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=30000
