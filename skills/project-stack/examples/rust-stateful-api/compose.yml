services:
  app:
    image: notes-api:local
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://notes:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/notes
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:3000/readyz",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
