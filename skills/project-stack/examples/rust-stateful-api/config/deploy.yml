<%
require "json"
require "open3"
environment = ENV.fetch("DEPLOY_ENV")
raise "Invalid deployment environment" unless %w[staging production].include?(environment)
output_json, status = Open3.capture2("tofu", "-chdir=infra", "output", "-json")
raise "Could not read deployment outputs from OpenTofu state" unless status.success?
outputs = JSON.parse(output_json)
vps_ip = outputs.fetch("vps_ip").fetch("value").strip
runtime = outputs.fetch("runtime").fetch("value").fetch(environment)
raise "Deployment hosts must not be empty" if vps_ip.empty? || runtime.fetch("host").empty?
%>
service: notes-api-<%= environment %>
image: <%= ENV.fetch("REGISTRY_NAMESPACE").downcase %>/notes-api
servers:
  web:
    hosts:
      - <%= vps_ip %>
    options:
      memory: 512m
      read-only: true
      cap-drop: ALL
      security-opt: no-new-privileges:true
ssh:
  user: deploy
  forward_agent: false
proxy:
  host: <%= runtime.fetch("host") %>
  ssl: true
  app_port: 3000
  healthcheck:
    path: /readyz
registry:
  server: ghcr.io
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  context: .
env:
  clear:
    RUST_LOG: info
  secret:
    - DATABASE_URL
    - API_TOKEN
accessories:
  db:
    service: notes-api-<%= environment %>-db
    image: postgres:17.11-trixie
    host: <%= vps_ip %>
    env:
      clear:
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
        - APP_DB_PASSWORD
    files:
      - config/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    directories:
      - /var/lib/notes-api/<%= environment %>/postgres:/var/lib/postgresql/data
    options:
      memory: 1g
