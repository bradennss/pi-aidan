<%
require "json"
require "open3"
output_json, status = Open3.capture2("tofu", "-chdir=infra", "output", "-json")
raise "Could not read deployment outputs from OpenTofu state" unless status.success?
outputs = JSON.parse(output_json)
vps_ip = outputs.fetch("vps_ip").fetch("value").strip
app_host = outputs.fetch("app_host").fetch("value").strip
raise "Deployment hosts must not be empty" if vps_ip.empty? || app_host.empty?
%>
service: notes-api
image: <%= ENV.fetch("REGISTRY_NAMESPACE", ENV.fetch("REGISTRY_USER")).downcase %>/notes-api
servers:
  web:
    hosts:
      - <%= vps_ip %>
    options:
      memory: 512m
      read-only: true
      cap-drop: ALL
      security-opt: no-new-privileges:true
ssh:
  user: deploy
  forward_agent: false
proxy:
  host: <%= app_host %>
  # HTTP-01 works through Cloudflare on port 80; do not block, cache or redirect
  # /.well-known/acme-challenge/ in Cloudflare Access, WAF, Workers or rules.
  ssl: true
  app_port: 3000
  healthcheck:
    path: /readyz
registry:
  server: ghcr.io
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  context: .
env:
  clear:
    RUST_LOG: info
  secret:
    - DATABASE_URL
    - API_TOKEN
accessories:
  db:
    image: postgres:17.11-trixie
    host: <%= vps_ip %>
    env:
      clear:
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
        - APP_DB_PASSWORD
    files:
      - config/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 1g
