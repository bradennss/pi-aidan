name: Deploy staging
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy or retry
        required: true
        type: string
permissions:
  actions: write
  contents: write
  packages: read
jobs:
  deploy:
    uses: ./.github/workflows/deployment.yml
    with:
      environment: staging
      tag: ${{ inputs.tag }}
    secrets: inherit
