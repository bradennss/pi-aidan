name: Promote to production
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote
        required: true
        type: string
permissions:
  actions: write
  contents: write
  packages: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deployment.yml
    with:
      environment: production
      tag: ${{ inputs.tag }}
    secrets: inherit
