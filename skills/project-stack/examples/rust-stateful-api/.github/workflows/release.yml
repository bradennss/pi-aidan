name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_NAMESPACE: ${{ github.repository_owner }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-please.outputs.sha }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image name and local configuration
        run: |
          printf 'RELEASE_IMAGE=ghcr.io/%s/notes-api\n' "${REGISTRY_NAMESPACE,,}" >> "$GITHUB_ENV"
          cp .env.example .env
          docker compose up -d --wait db
      - name: Build the release image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: notes-api:local
          platforms: linux/amd64
          cache-from: type=gha,version=2,scope=notes-api-amd64
          cache-to: type=gha,version=2,scope=notes-api-amd64,mode=max
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
      - name: Smoke-test the image
        run: |
          docker compose up --no-build -d --wait
          docker compose exec -T app curl --fail http://127.0.0.1:3000/healthz
          docker compose exec -T app curl --fail http://127.0.0.1:3000/readyz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release image
        run: |
          docker tag notes-api:local "$RELEASE_IMAGE:$RELEASE_VERSION"
          docker push "$RELEASE_IMAGE:$RELEASE_VERSION"
      - name: Deploy the published release to staging
        run: gh workflow run staging.yml --ref main -f "tag=$RELEASE_TAG"
      - name: Clean up
        if: always()
        run: docker compose down -v
