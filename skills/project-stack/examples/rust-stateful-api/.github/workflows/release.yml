name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_NAMESPACE: ${{ github.repository_owner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful main CI for this commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" \
            --jq '.workflow_runs[0] | .status == "completed" and .conclusion == "success"' | grep -qx true
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.0
          install_args: rust jq
      - name: Resolve the release version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\nRELEASE_IMAGE=ghcr.io/%s/notes-api\n' "$version" "${REGISTRY_NAMESPACE,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - run: |
          cp .env.example .env
          docker compose up -d --wait db
      - name: Build the release image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: notes-api:local
          platforms: linux/amd64
          cache-from: type=gha,version=2,scope=notes-api-amd64
          cache-to: type=gha,version=2,scope=notes-api-amd64,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke-test the image
        run: |
          docker compose up --no-build -d --wait
          docker compose exec -T app curl --fail http://127.0.0.1:3000/healthz
          docker compose exec -T app curl --fail http://127.0.0.1:3000/readyz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image and release tag
        run: |
          docker tag notes-api:local "$RELEASE_IMAGE:$RELEASE_VERSION"
          docker push "$RELEASE_IMAGE:$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes ""
      - name: Start staging for the token-created tag
        run: gh workflow run staging.yml --ref main -f "tag=v$RELEASE_VERSION"
      - name: Clean up
        if: always()
        run: docker compose down -v
