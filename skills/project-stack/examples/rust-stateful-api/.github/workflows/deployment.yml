name: Deployment
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tag:
        default: ""
        type: string
permissions:
  actions: write
  contents: write
  packages: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: shared-vps
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_NAMESPACE: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate target
        run: |
          case "$DEPLOY_ENV" in staging|production|infrastructure) ;; *) exit 1 ;; esac
          if [[ "$DEPLOY_ENV" != infrastructure ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git rev-parse --verify "$RELEASE_TAG^{commit}"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev libgmp-dev libsqlite3-dev
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.0
          install_args: just opentofu ruby gem:kamal python uv pipx:ansible-core sops age jq node
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
      - run: just ansible-deps
      - name: Reinstall and configure the shared VPS
        id: infra
        run: just infra
      - name: Commit encrypted OpenTofu state to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && (steps.infra.outcome == 'success' || steps.infra.outcome == 'failure' || steps.infra.outcome == 'cancelled')
        run: |
          if [[ -f infra/terraform.tfstate ]]; then
            jq -e '.encrypted_data | type == "string"' infra/terraform.tfstate > /dev/null
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add infra/terraform.tfstate
            if ! git diff --cached --quiet; then
              git commit -m "Update encrypted OpenTofu state"
              git pull --rebase origin main
              git push origin HEAD:main
              gh workflow run ci.yml --ref main
            fi
          fi
      - name: Deploy the published release
        if: inputs.environment != 'infrastructure'
        run: just deploy
