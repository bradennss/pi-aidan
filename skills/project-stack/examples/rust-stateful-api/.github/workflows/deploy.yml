name: Build and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.0
          install_args: rust jq
      - name: Set image version
        id: release
        env:
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')-sha.${GITHUB_SHA}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_IMAGE=ghcr.io/%s/notes-api:%s\n' "${REGISTRY_NAMESPACE,,}" "$version" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Start PostgreSQL
        run: docker compose up -d --wait db
      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: notes-api:local
          platforms: linux/amd64
          cache-from: type=gha,version=2,scope=notes-api-amd64
          cache-to: type=gha,version=2,scope=notes-api-amd64,mode=max
      - name: Exercise the application image
        run: |
          docker compose up --no-build -d --wait
          docker compose exec -T app curl --fail http://127.0.0.1:3000/healthz
          docker compose exec -T app curl --fail http://127.0.0.1:3000/readyz
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: |
          docker tag notes-api:local "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
      - name: Clean up
        if: always()
        run: docker compose down -v
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev libgmp-dev libsqlite3-dev
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.0
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust the first key automatically; reject changes on later connections.
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
      - name: Deploy
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just deploy --skip-push
