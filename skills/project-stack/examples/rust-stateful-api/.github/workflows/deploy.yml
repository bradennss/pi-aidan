name: Deploy
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: check
    runs-on: ubuntu-24.04
    # Require approval; set SOPS_AGE_KEY and SSH_PRIVATE_KEY here.
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev libgmp-dev libsqlite3-dev
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.0
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_TAG" = "v$version"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust the first key automatically; reject changes on later connections.
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
      - name: Deploy
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just deploy
