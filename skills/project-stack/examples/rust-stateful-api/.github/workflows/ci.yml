name: CI
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev libgmp-dev libsqlite3-dev
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.0
      - name: Prepare local configuration
        run: cp .env.example .env
      - name: Install Ansible collections
        run: just ansible-deps
      - name: Start PostgreSQL
        run: docker compose up -d --wait db
      - name: Check
        env:
          TF_VAR_state_passphrase: validation-only-key-not-used-for-real-state
        run: just check
      - name: Exercise the application image
        run: |
          just up
          docker compose exec -T app curl --fail http://127.0.0.1:3000/up
      - name: Clean up
        if: always()
        run: docker compose down -v
